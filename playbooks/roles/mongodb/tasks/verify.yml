---
# Verify MongoDB TLS is working. requireTLS mode means every connection on
# the configured port must TLS-handshake immediately — no STARTTLS needed.

- name: "TLS_VERIFY mongodb"
  ansible.builtin.shell: |
    result=$(echo | openssl s_client -connect 127.0.0.1:{{ product_vars.mongo_port | default(27017) }} 2>&1)
    subject=$(echo "$result" | grep "subject=" | head -1 | sed 's/.*subject=//')
    issuer=$(echo "$result" | grep "issuer=" | head -1 | sed 's/.*issuer=//')
    expiry=$(echo "$result" | grep "notAfter=" | head -1 | sed 's/.*notAfter=//')
    verify=$(echo "$result" | grep "Verify return code:" | head -1 | sed 's/.*Verify return code: //')
    protocol=$(echo "$result" | grep -E "^\s+Protocol\s*:" | head -1 | awk -F: '{print $2}' | xargs)
    cipher=$(echo "$result" | grep -E "^\s+Cipher\s*:" | head -1 | awk -F: '{print $2}' | xargs)
    if echo "$result" | grep -q "CONNECTED"; then
      echo "TLS_RESULT:{\"product\":\"mongodb\",\"port\":{{ product_vars.mongo_port | default(27017) }},\"status\":\"ok\",\"subject\":\"$subject\",\"issuer\":\"$issuer\",\"expiry\":\"$expiry\",\"verify\":\"$verify\",\"protocol\":\"$protocol\",\"cipher\":\"$cipher\"}"
    else
      echo "TLS_RESULT:{\"product\":\"mongodb\",\"port\":{{ product_vars.mongo_port | default(27017) }},\"status\":\"failed\",\"error\":\"Connection refused or TLS handshake failed\"}"
    fi
  register: mongodb_tls_check
  changed_when: false
  failed_when: false
  when: product_vars.mongo_tls_enabled | default(true) | bool

- name: "TLS_OUTPUT mongodb"
  ansible.builtin.debug:
    msg: "{{ mongodb_tls_check.stdout_lines | select('match', '^TLS_RESULT:') | list }}"
  when: product_vars.mongo_tls_enabled | default(true) | bool
