---
- name: Purge existing docker packages
  apt:
    name: [docker.io, docker-doc, docker-compose, podman-docker, containerd, runc]
    state: absent
    purge: yes
  ignore_errors: yes

- name: Install prerequisites
  apt:
    name: [ca-certificates, curl, gnupg]
    state: present
    update_cache: yes

- name: Create keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker GPG key
  shell: |
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
    chmod a+r /etc/apt/keyrings/docker.gpg
  args:
    creates: /etc/apt/keyrings/docker.gpg

- name: Add Docker repository
  copy:
    dest: /etc/apt/sources.list.d/docker.list
    content: |
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_facts.distribution_release }} stable
    mode: "0644"

- name: Install Docker CE
  apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin]
    state: present
    update_cache: yes

- name: Install Docker Compose plugin
  apt:
    name: docker-compose-plugin
    state: present
  when: product_vars.docker_compose | default(true) | bool

# --- TLS on the Docker API ---
# The catalogue has always advertised server_tls for this product, but
# nothing wired it up: no certs deployed, no daemon.json TLS keys, no
# listener beyond the default Unix socket. Adding all three here.

- name: Create Docker SSL directory
  file:
    path: /etc/docker/ssl
    state: directory
    owner: root
    group: root
    mode: "0750"
  when: product_vars.docker_tls_enabled | default(true) | bool

- name: Deploy Docker server certificate
  copy:
    content: "{{ server_cert_pem }}"
    dest: /etc/docker/ssl/server-cert.pem
    owner: root
    group: root
    mode: "0644"
  when: product_vars.docker_tls_enabled | default(true) | bool

- name: Deploy Docker server key
  copy:
    content: "{{ server_key_pem }}"
    dest: /etc/docker/ssl/server-key.pem
    owner: root
    group: root
    mode: "0600"
  when: product_vars.docker_tls_enabled | default(true) | bool

- name: Deploy Docker CA chain
  copy:
    content: "{{ ca_chain_pem }}"
    dest: /etc/docker/ssl/ca.pem
    owner: root
    group: root
    mode: "0644"
  when: product_vars.docker_tls_enabled | default(true) | bool

# dockerd refuses to start if a host is given both on the command line
# (systemd's default ExecStart already has "-H fd://") and in daemon.json's
# "hosts" key ("conflicting options: hosts and hosts") — clearing the
# packaged ExecStart via a drop-in is the standard way to let daemon.json's
# "hosts" (needed below to add the TLS listener) take effect at all.
- name: Create docker.service.d drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: product_vars.docker_tls_enabled | default(true) | bool

- name: Clear default dockerd -H flag via systemd drop-in
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/override.conf
    content: |
      [Service]
      ExecStart=
      ExecStart=/usr/bin/dockerd
    owner: root
    group: root
    mode: "0644"
  when: product_vars.docker_tls_enabled | default(true) | bool

- name: Configure daemon.json
  copy:
    dest: /etc/docker/daemon.json
    content: >-
      {{
        (
          {
            'hosts': ['unix:///var/run/docker.sock', 'tcp://0.0.0.0:' + (product_vars.docker_tls_port | default(2376) | string)],
            'tls': true, 'tlsverify': true,
            'tlscacert': '/etc/docker/ssl/ca.pem',
            'tlscert': '/etc/docker/ssl/server-cert.pem',
            'tlskey': '/etc/docker/ssl/server-key.pem',
          } if (product_vars.docker_tls_enabled | default(true) | bool) else {}
        ) | combine(product_vars.docker_daemon_json | default('{}') | from_json) | to_nice_json
      }}
    owner: root
    group: root
    mode: "0644"

- name: Add users to docker group
  user:
    name: "{{ item }}"
    groups: docker
    append: yes
  loop: "{{ (product_vars.docker_users | default('')).split(',') | map('trim') | select | list }}"
  when: product_vars.docker_users | default('') | length > 0

- name: Enable and restart docker
  systemd:
    name: docker
    enabled: yes
    state: restarted
    daemon_reload: yes

- name: Verify Docker installation
  command: docker --version
  register: docker_ver
  changed_when: false

- name: Show Docker version
  debug:
    msg: "{{ docker_ver.stdout }}"
