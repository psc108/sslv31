---
- name: Deploy MySQL server certificate
  ansible.builtin.copy:
    content: "{{ _cert_pem }}"
    dest: /etc/mysql/ssl/server-cert.pem
    mode: "0644"
    owner: mysql
    group: mysql
  notify: restart mysql

- name: Deploy MySQL server key
  ansible.builtin.copy:
    content: "{{ _key_pem }}"
    dest: /etc/mysql/ssl/server-key.pem
    mode: "0600"
    owner: mysql
    group: mysql
  notify: restart mysql

- name: Deploy MySQL CA certificate
  ansible.builtin.copy:
    content: "{{ _ca_pem }}"
    dest: /etc/mysql/ssl/ca.pem
    mode: "0644"
    owner: mysql
    group: mysql
  notify: restart mysql
