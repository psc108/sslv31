---
- name: Verify Node.js is installed
  ansible.builtin.shell: |
    NODE_VER=$(node --version 2>/dev/null || echo "NOT_INSTALLED")
    NPM_VER=$(npm --version 2>/dev/null || echo "NOT_INSTALLED")
    echo "{\"TLS_RESULT\": {\"service\": \"nodejs\", \"status\": \"ok\", \"node_version\": \"$NODE_VER\", \"npm_version\": \"$NPM_VER\"}}"
  register: verify_result
  changed_when: false

- name: Show verify result
  ansible.builtin.debug:
    msg: "{{ verify_result.stdout }}"
