---
- name: Purge existing haproxy
  apt:
    name: haproxy
    state: absent
    purge: yes
  ignore_errors: yes

- name: Install haproxy
  apt:
    name: haproxy
    state: present
    update_cache: yes

# Bare haproxy_* vars were never actually wired up — site.yml's product loop
# only sets product_vars (the whole dict), never flattens it into bare names,
# so every reference here used to silently fall through to its | default(...)
# regardless of what was actually configured. Every reference is now
# product_vars.<key>, matching haproxy_*'s own config_schema keys in
# catalogue_service.py and the working pattern already used by rabbitmq/mysql.

- name: Create haproxy SSL directory
  file:
    path: /etc/haproxy/ssl
    state: directory
    owner: haproxy
    group: haproxy
    mode: "0750"
  when: product_vars.haproxy_tls_enabled | default(true) | bool

# haproxy's "ssl crt" directive wants cert+key concatenated in one file,
# unlike the separate-file convention every other TLS role here uses.
- name: Deploy HAProxy combined certificate+key PEM
  copy:
    content: "{{ server_cert_pem }}\n{{ server_key_pem }}"
    dest: /etc/haproxy/ssl/combined.pem
    owner: haproxy
    group: haproxy
    mode: "0600"
  when: product_vars.haproxy_tls_enabled | default(true) | bool

- name: Deploy HAProxy CA chain
  copy:
    content: "{{ ca_chain_pem }}"
    dest: /etc/haproxy/ssl/ca.crt
    owner: haproxy
    group: haproxy
    mode: "0644"
  when: product_vars.haproxy_tls_enabled | default(true) | bool

- name: Configure haproxy
  copy:
    dest: /etc/haproxy/haproxy.cfg
    content: |
      global
          log /dev/log local0
          log /dev/log local1 notice
          chroot /var/lib/haproxy
          stats socket /run/haproxy/admin.sock mode 660 level admin
          stats timeout 30s
          user haproxy
          group haproxy
          daemon
      {% if product_vars.haproxy_tls_enabled | default(true) | bool %}
          ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
          ssl-default-bind-options ssl-min-ver TLSv1.2
      {% endif %}

      defaults
          log     global
          mode    http
          option  httplog
          option  dontlognull
          timeout connect 5000
          timeout client  50000
          timeout server  50000

      # Stats
      listen stats
          bind *:{{ product_vars.haproxy_stats_port | default(8404) }}
          stats enable
          stats uri /stats
          stats refresh 10s
      {% if product_vars.haproxy_stats_user | default('') %}
          stats auth {{ product_vars.haproxy_stats_user }}:{{ product_vars.haproxy_stats_password | default('admin') }}
      {% endif %}

      {% if product_vars.haproxy_tls_enabled | default(true) | bool and (product_vars.haproxy_frontends | default([]) | length == 0) %}
      # Built-in TLS-terminating frontend — added automatically because no
      # custom Frontends are configured below. Proves the deployed cert is
      # genuinely live and served by HAProxy without requiring the operator
      # to also stand up a real backend just to test connectivity.
      frontend default_tls
          bind *:{{ product_vars.haproxy_tls_port | default(443) }} ssl crt /etc/haproxy/ssl/combined.pem
          http-request return status 200 content-type text/plain string "OK"
      {% endif %}

      # Frontends
      {% for fe in product_vars.haproxy_frontends | default([]) %}
      frontend {{ fe.name }}
          bind {{ fe.bind }}
          mode {{ fe.mode | default('http') }}
          default_backend {{ fe.default_backend }}
      {% endfor %}

      # Backends
      {% for be in product_vars.haproxy_backends | default([]) %}
      backend {{ be.name }}
          mode {{ be.mode | default('http') }}
          balance {{ be.balance | default('roundrobin') }}
      {% for srv in be.servers.split(',') %}
      {% set parts = srv.strip().split(':') %}
          server {{ parts[0] }} {{ parts[1] }}:{{ parts[2] }} check
      {% endfor %}
      {% endfor %}
    owner: root
    group: root
    mode: "0644"
  notify: restart haproxy

- name: Enable and restart haproxy
  systemd:
    name: haproxy
    enabled: yes
    state: restarted
    daemon_reload: yes
