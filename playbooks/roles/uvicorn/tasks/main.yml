---
# Uvicorn/FastAPI role — deploys a Python ASGI application with TLS.
# Purges any existing installation for clean-state builds.

- name: Merge product vars with defaults
  ansible.builtin.set_fact:
    uvicorn_port: "{{ product_vars.uvicorn_port | default(8000) }}"
    uvicorn_workers: "{{ product_vars.uvicorn_workers | default(4) }}"
    uvicorn_app_module: "{{ product_vars.uvicorn_app_module | default('main:app') }}"
    uvicorn_ssl_enabled: "{{ product_vars.uvicorn_ssl_enabled | default(true) }}"
    uvicorn_app_repo: "{{ product_vars.uvicorn_app_repo | default('') }}"
    uvicorn_app_branch: "{{ product_vars.uvicorn_app_branch | default('main') }}"
    uvicorn_extra_pip_packages: "{{ (product_vars.uvicorn_extra_pip_packages | default('')).split(',') | map('trim') | select | join(' ') }}"

# --- Nuke existing installation for clean state ---

- name: Stop existing uvicorn service
  ansible.builtin.systemd:
    name: uvicorn
    state: stopped
  failed_when: false

- name: Remove existing app directory
  ansible.builtin.file:
    path: /opt/app
    state: absent

- name: Remove existing systemd unit
  ansible.builtin.file:
    path: /etc/systemd/system/uvicorn.service
    state: absent

# --- Install dependencies ---

- name: Install Python packages (Debian)
  ansible.builtin.include_tasks: ../../common/tasks/resilient_apt_install.yml
  vars:
    resilient_apt_packages: [python3-pip, python3-venv, git]
  when: ansible_facts.os_family == "Debian"

# python3.11, not RHEL8's system python3 (3.6, too old for current
# fastapi/uvicorn releases) — same reasoning as the keystone role.
# python3.11-packaging is needed by ansible.builtin.pip itself (not the
# venv) — that module imports "packaging" on whatever interpreter Ansible
# is running as (python3.11 here, via ansible_python_interpreter), and it's
# not pulled in by python3.11/python3.11-pip on their own — found via a
# real run: "Failed to import the required Python library (packaging)".
- name: Install Python packages (RHEL)
  ansible.builtin.include_tasks: ../../common/tasks/resilient_dnf_install.yml
  vars:
    resilient_dnf_packages: [python3.11, python3.11-pip, python3.11-packaging, git]
  when: ansible_facts.os_family == "RedHat"

# --- Create app user and directory ---

- name: Create app user
  ansible.builtin.user:
    name: appuser
    system: true
    shell: /usr/sbin/nologin
    home: /opt/app
    create_home: false

- name: Create app directory
  ansible.builtin.file:
    path: /opt/app
    state: directory
    owner: appuser
    group: appuser
    mode: "0755"

# --- Deploy application ---

- name: Ensure src directory exists for sample app
  ansible.builtin.file:
    path: /opt/app/src
    state: directory
    owner: appuser
    group: appuser
    mode: "0755"
  when: uvicorn_app_repo | length == 0

- name: Create sample FastAPI app (no repo specified)
  ansible.builtin.copy:
    content: |
      from fastapi import FastAPI

      app = FastAPI(title="Backend Service")

      @app.get("/health")
      def health():
          return {"status": "ok"}

      @app.get("/")
      def root():
          return {"service": "backend", "tls": True}
    dest: /opt/app/src/main.py
    owner: appuser
    group: appuser
    mode: "0644"
  when: uvicorn_app_repo | length == 0

- name: Clone application repository
  ansible.builtin.git:
    repo: "{{ uvicorn_app_repo }}"
    dest: /opt/app/src
    version: "{{ uvicorn_app_branch }}"
  when: uvicorn_app_repo | length > 0

# --- Python virtual environment ---

- name: Create virtual environment (Debian)
  ansible.builtin.command:
    cmd: python3 -m venv /opt/app/venv
    creates: /opt/app/venv/bin/activate
  when: ansible_facts.os_family == "Debian"

- name: Create virtual environment (RHEL)
  ansible.builtin.command:
    cmd: python3.11 -m venv /opt/app/venv
    creates: /opt/app/venv/bin/activate
  when: ansible_facts.os_family == "RedHat"

- name: Install FastAPI and Uvicorn in venv
  ansible.builtin.pip:
    name:
      - fastapi
      - uvicorn[standard]
    virtualenv: /opt/app/venv
    state: present

- name: Install requirements.txt if present
  ansible.builtin.pip:
    requirements: /opt/app/src/requirements.txt
    virtualenv: /opt/app/venv
    state: present
  failed_when: false

- name: Install extra pip packages in app venv
  ansible.builtin.shell: |
    /opt/app/venv/bin/pip install {{ uvicorn_extra_pip_packages }} 2>&1 | tail -20
  when: uvicorn_extra_pip_packages | length > 0
  changed_when: true

# --- Deploy TLS certificates ---

- name: Create app SSL directory
  ansible.builtin.file:
    path: /opt/app/ssl
    state: directory
    owner: appuser
    group: appuser
    mode: "0750"

- name: Deploy server certificate
  ansible.builtin.copy:
    content: "{{ server_cert_pem }}"
    dest: /opt/app/ssl/server.pem
    owner: appuser
    group: appuser
    mode: "0644"
  notify: restart uvicorn

- name: Deploy server private key
  ansible.builtin.copy:
    content: "{{ server_key_pem }}"
    dest: /opt/app/ssl/server-key.pem
    owner: appuser
    group: appuser
    mode: "0600"
  notify: restart uvicorn

- name: Deploy CA chain
  ansible.builtin.copy:
    content: "{{ ca_chain_pem }}"
    dest: /opt/app/ssl/ca.pem
    owner: appuser
    group: appuser
    mode: "0644"

- name: Deploy client certificate
  ansible.builtin.copy:
    content: "{{ client_cert_pem }}"
    dest: /opt/app/ssl/client.pem
    owner: appuser
    group: appuser
    mode: "0644"
  when: client_cert_pem is defined and client_cert_pem | length > 0

- name: Deploy client private key
  ansible.builtin.copy:
    content: "{{ client_key_pem }}"
    dest: /opt/app/ssl/client-key.pem
    owner: appuser
    group: appuser
    mode: "0600"
  when: client_key_pem is defined and client_key_pem | length > 0

# --- Systemd service ---

- name: Deploy uvicorn systemd unit
  ansible.builtin.template:
    src: uvicorn.service.j2
    dest: /etc/systemd/system/uvicorn.service
    mode: "0644"
  notify: restart uvicorn

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable and start uvicorn
  ansible.builtin.systemd:
    name: uvicorn
    state: started
    enabled: true

- name: Set ownership on app directory
  ansible.builtin.file:
    path: /opt/app
    state: directory
    owner: appuser
    group: appuser
    recurse: true

# --- Sudo users ---

- name: Configure sudo users
  ansible.builtin.include_tasks: ../../common/tasks/sudo_users.yml
  vars:
    sudo_users_list: "{{ product_vars.uvicorn_sudo_users | default('') }}"
    sudo_nopasswd: "{{ product_vars.uvicorn_sudo_nopasswd | default(false) }}"
  when: (product_vars.uvicorn_sudo_users | default('')) | length > 0

- name: Deploy custom files
  ansible.builtin.include_tasks: ../../common/tasks/file_deployments.yml
  vars:
    file_deployments: "{{ product_vars.uvicorn_file_deployments }}"
  when: (product_vars.uvicorn_file_deployments | default([])) | length > 0
