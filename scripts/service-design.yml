  // ----------------------
  // Utility Functions
  // ----------------------
  function buildActionFromFlow(actionFlows, id) {
    const f = actionFlows[id];
    const action = { actionId: id };

    ['name','description','iconId','actionType','roles'].forEach(k => action[k] = f[k]);

    if (f.optionsModel) {
      action.optionsModel = clone(f.optionsModel);
    }

    return action;
  }

  function buildPropertiesFromResource(src, comp, ids, prefix) {
    ids.forEach(id => {
      const name = _localizedValues[(prefix || '') + id] || id;
      addProperty(comp.properties, buildProperty(id, name, src[id]));
    });
  }

  function addProperty(list, prop) {
    if (prop && prop.id && prop.value !== null && prop.value !== undefined) {
      list.push(prop);
    }
  }

  function buildProperty(id, name, value, type) {
    return {
      id,
      name: name || id, 
      type: type || 'TEXT_INPUT',
      value: value != null ? String(value) : null
    };
  }

  function findByPredicate(arr, pred) {
    let out = null;
    (arr || []).some(i => {
      if (pred(i)) { out = i; return true; }
      return false;
    });
    return out;
  }

  function clone(o) {
    return o == null ? null : JSON.parse(JSON.stringify(o));
  }

  function Array_isArray(o) {
    return Object.prototype.toString.call(o) === '[object Array]';
  }

  // ----------------------
  // Dynamic Dropdown Helpers
  // ----------------------

  function getAttachedDisks(vmResource) {
    const disks =
      vmResource &&
      vmResource.properties &&
      vmResource.properties.storage &&
      Array.isArray(vmResource.properties.storage.disks)
        ? vmResource.properties.storage.disks
        : [];

    return disks.map(function (d) {
      return {
        id: d.id,
        name: d.name + " (" + d.capacityGb + " GB)"
      };
    });
  }

