javascriptFunctionDefinitions: |-
  var _localizedValues = typeof _localizedValues !== 'undefined' ? _localizedValues : {};

  // ----------------------
  // Instance Construction
  // ----------------------
  function buildInstance(options, deployment, deploymentActions, deploymentResourcesActions) {
    const actionFlows = _actionFlowsForBuilder;
    const instance = buildInstanceBase(options, deployment);
    instance.components = buildComponents(deployment, deploymentResourcesActions, actionFlows);
    addInstanceActions(instance, deploymentActions, actionFlows);
    return { serviceInstance: instance };
  }

  function buildInstanceBase(options, deployment) {
    const fulfillment = _createFulfillmentForBuilder;
    let instance = _serviceInstanceForBuilder || {
      state: fulfillment.state === 'FAILURE' ? 'TERMINATED' : 'PENDING'
    };

    instance.name = deployment.name;
    instance.description = `Created from CPS order ${fulfillment.creationRequestId}`;
    instance.cloudProvider = 'vmware';

    if (options && options.VM_HOSTNAME) {
      instance.name += ' - ' + options.VM_HOSTNAME;
    }

    const deploymentExists = deployment && Object.keys(deployment).length > 0;

    if (fulfillment.state === 'SUCCESS') {
      instance.state = deploymentExists ? 'ACTIVE' : 'CANCELLED';
    } else if (fulfillment.state === 'FAILURE' || !deploymentExists) {
      instance.state = 'TERMINATED';
    } else {
      instance.state = 'PENDING';
    }

    return instance;
  }

  // ----------------------
  // Component Builders
  // ----------------------
  function buildComponents(deployment, resourceActions, actionFlows) {
    const components = [];
    const diskComponents = [];

    (deployment && deployment.resources || [])
      .filter(r => r.type === 'Cloud.vSphere.Disk')
      .forEach(disk => diskComponents.push(buildDiskComponent(disk)));

    (deployment && deployment.resources || [])
      .filter(r => r.type === 'Cloud.vSphere.Machine')
      .forEach(vm => {
        const vmComp = buildVMComponent(deployment, vm, resourceActions, actionFlows);
        components.push(vmComp);

        (vm.dependsOn || []).forEach(dep => {
          const diskComp = findByPredicate(diskComponents, c => c.name === dep);
          if (diskComp) {
            diskComp.parentComponentId = vmComp.componentId;
            components.push(diskComp);
          }
        });
      });

    return components;
  }

  function buildVMComponent(deployment, vmResource, resourceActions, actionFlows) {
    const powerState = vmResource.properties && vmResource.properties.powerState || 'UNKNOWN';

    const vmComponent = {
      componentId: `${vmResource.id}`,
      key: `VM_${vmResource.id}`,
      name: `${vmResource.name}`,
      properties: [],
      availableActions: [],
      components: [],
      iconId: 'ad7d4c19-f2ae-385b-b631-39fb2f36334c',
      state: { text: `${powerState}`, category: 'INFO' }
    };

    if (vmResource.properties) {
  
      buildPropertiesFromResource(vmResource.properties, vmComponent,
        ['hostName','address','image','cpuCount','totalMemoryMB','osType','name','primaryMAC'],
        'machine.properties.');

      const disks = vmResource.properties.storage && vmResource.properties.storage.disks || [];
      disks.forEach((disk, i) => {
        addProperty(vmComponent.properties, buildProperty(`disk${i}.name`,
          _localizedValues['machine.properties.disk.name'], disk.name));
        addProperty(vmComponent.properties, buildProperty(`disk${i}.capacityGb`,
          _localizedValues['machine.properties.disk.capacityGb'], String(disk.capacityGb)));
        addProperty(vmComponent.properties, buildProperty(`disk${i}.type`,
          _localizedValues['machine.properties.disk.type'], disk.type));
        addProperty(vmComponent.properties, buildProperty(`disk${i}.encrypted`,
          _localizedValues['machine.properties.disk.encrypted'], String(disk.encrypted), 'CHECKBOX'));
      });

      const networks = vmResource.properties.networks || [];
      networks.forEach((net, i) => {
        addProperty(vmComponent.properties, buildProperty(`network${i}.name`,
          _localizedValues['machine.properties.network.name'], net.name));
        addProperty(vmComponent.properties, buildProperty(`network${i}.address`,
          _localizedValues['machine.properties.network.address'], net.address));
        addProperty(vmComponent.properties, buildProperty(`network${i}.info`,
          _localizedValues['machine.properties.network.info'], net.address));
        addProperty(vmComponent.properties, buildProperty(`network${i}.deviceIndex`,
          _localizedValues['machine.properties.network.deviceIndex'], String(net.deviceIndex), 'NUMBER_INPUT'));
      });
    }

    addVmActions(vmComponent, vmResource, deployment, resourceActions, actionFlows);
    return vmComponent;
  }

  function buildDiskComponent(diskResource) {
    const diskId = `${diskResource.id}_storageDisk_${diskResource.name}`;
    const props = diskResource.properties || {};

    const comp = {
      componentId: diskId,
      key: `DISK_${diskId}`,
      name: diskResource.name,
      properties: [],
      iconId: '58c25c83-83c2-3d7b-b3db-603931fffcde',
      state: { text: 'ATTACHED', category: 'INFO' }
    };

    addProperty(comp.properties, buildProperty('capacityGb',
      _localizedValues['disk.properties.capacityGb'], String(props.capacityGb), 'NUMBER_INPUT'));
    addProperty(comp.properties, buildProperty('type',
      _localizedValues['disk.properties.type'], props.type));
    addProperty(comp.properties, buildProperty('status',
      _localizedValues['disk.properties.status'], props.status));
    addProperty(comp.properties, buildProperty('resourceName',
      _localizedValues['disk.properties.resourceName'], props.resourceName));
    addProperty(comp.properties, buildProperty('diskId',
      'Disk Resource ID', diskResource.id));

    return comp;
  }

  // ----------------------
  // Action Wiring
  // ----------------------
  function addInstanceActions(instance, deploymentActionsString, actionFlows) {
      const actions = deploymentActionsString ? JSON.parse(deploymentActionsString) : null;
      if (!actions || instance.state === 'CANCELLED') return;

      function add(id, flowId=id) {
        // Added actionFlows[flowId] check to ensure the flow exists in the YAML
        if (findByPredicate(actions, a => a.id === id && a.valid) && actionFlows[flowId]) {
          instance.availableActions.push(buildActionFromFlow(actionFlows, flowId));
        }
      }

    add('Deployment.PowerOff');
    add('Deployment.PowerOn');
    add('Deployment.Delete', 'delete');
    add('Deployment.Update');
    add('Deployment.ChangeOwner');
  }

  function addVmActions(vmComponent, vmResource, deployment, resourceActions, actionFlows) {
      const vmActions = resourceActions && resourceActions[vmResource.id] || [];

      function add(id, flowId=id) {
        // Added actionFlows[flowId] check to ensure the flow exists in the YAML
        if (findByPredicate(vmActions, a => a.id === id && a.valid) && actionFlows[flowId]) {
          const act = buildActionFromFlow(actionFlows, flowId);
          act.invocationContext = { deploymentId: deployment.id, resourceId: vmResource.id };
          vmComponent.availableActions.push(act);
        }
      }

    // VM lifecycle
    add('Cloud.vSphere.Machine.Resize');
    add('Cloud.vSphere.Machine.PowerOn', 'Deployment.PowerOn');
    add('Cloud.vSphere.Machine.PowerOff', 'Deployment.PowerOff');

    // Snapshot actions: only Create has inputs; Delete/Revert have none
    add('Cloud.vSphere.Machine.Snapshot.Create');
    add('Cloud.vSphere.Machine.Snapshot.Delete');
    add('Cloud.vSphere.Machine.Snapshot.Revert');

    // Other VM actions
    add('Cloud.vSphere.Machine.Reboot');
    add('Cloud.vSphere.Machine.Rebuild');
    add('Cloud.vSphere.Machine.Remove.Disk');
    add('Cloud.vSphere.Machine.Add.Disk');
    add('Cloud.vSphere.Machine.Suspend');
    add('Cloud.vSphere.Machine.Delete');
    add('Cloud.vSphere.Machine.custom.day2customeadddisk');
  }

