server {
    listen 443 ssl;
    server_name certs.cso.internal;

    ssl_certificate /var/lib/certmanager/self/server.pem;
    ssl_certificate_key /var/lib/certmanager/self/server-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /opt/certmanager/frontend/dist;
    index index.html;

    # SPA fallback
    try_files $uri $uri/ /index.html;

    # API proxy to Gunicorn unix socket
    location /api/ {
        proxy_pass http://unix:/run/certmanager/certmanager.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    server_name certs.cso.internal;
    return 301 https://$host$request_uri;
}
