[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neural"
version = "0.1.0"
description = "ML intelligence layer for ssl diagnostic pipeline"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "torch>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["phase5*"]
